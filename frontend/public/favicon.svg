<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Serving Cloche (Food Court Dome) -->
  <g transform="translate(0, 10)" filter="url(#glow)">
    <!-- Cloche Handle Knob -->
    <circle cx="256" cy="145" r="22" fill="url(#goldGrad)"/>
    <path d="M250 162 h12 v22 h-12 z" fill="url(#goldGrad)"/>

    <!-- Cloche Dome -->
    <path d="M120 300 C120 190 200 180 256 180 C312 180 392 190 392 300 Z" fill="url(#goldGrad)"/>
    
    <!-- Dome Specular Highlight -->
    <path d="M155 285 C155 215 210 200 250 198 C220 205 175 225 170 285 Z" fill="#ffffff" opacity="0.35"/>

    <!-- Cloche Serving Platter / Base Plate -->
    <rect x="96" y="308" width="320" height="24" rx="12" fill="url(#goldGrad)"/>
    
    <!-- Steam / Aroma Swirls -->
    <path d="M210 115 C205 95 220 85 215 70" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
    <path d="M256 105 C250 85 265 75 260 55" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <path d="M302 115 C297 95 312 85 307 70" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" opacity="0.75"/>

    <!-- Subtle Cutlery Silhouette at Base -->
    <g transform="translate(200, 355)" opacity="0.9">
      <!-- Fork -->
      <path d="M24 0 v32 M12 0 v16 c0 8 12 8 12 16 v24 M36 0 v16 c0 8 -12 8 -12 16" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
      <!-- Knife -->
      <path d="M88 0 v56 c0 16 -12 16 -12 32 M88 0 c12 8 12 32 0 40" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
